<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create-A-Wrestler Proof of Concept</title>
  <meta name="description" content="Create-A-Wrestler Proof-of-Concept for Virtual Pro Grappler: a roster editor with a modular 3D wrestler built from GLB meshes and PNG texture layers.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/bootstrap.css">
  <link rel="stylesheet" href="css/app.css">
  <!-- Babylon.js and its glTF loader, pinned versions from the jsDelivr CDN -->
  <script src="https://cdn.jsdelivr.net/npm/babylonjs@9.29.0/babylon.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/babylonjs-loaders@9.29.0/babylonjs.loaders.min.js"></script>
</head>
<body class="app-body">
  <main class="anvil-content" data-view-host data-view="wrestlers">
    <div class="view-frame">
      <header class="view-header">
        <div class="view-title">
          <h1>Wrestlers <span class="view-count" data-count>0</span></h1>
          <p>Create-A-Wrestler. Names, size and look. Meshes, textures and data load from this project's folders.</p>
        </div>
        <div class="view-actions">
          <label class="search-field">
            <span data-icon="search"></span>
            <input type="search" placeholder="Search wrestlers" aria-label="Search wrestlers" data-search>
            <kbd>/</kbd>
          </label>
          <button type="button" class="button btn btn-outline-secondary button-ghost button-md changes-button" data-action="changes">
            <span data-icon="history"></span><span>Changes</span><span class="changes-count" data-changes-count hidden>0</span>
          </button>
          <button type="button" class="button btn btn-primary button-accent button-sm" data-action="export">
            <span data-icon="download"></span><span>Export roster</span>
          </button>
        </div>
      </header>
      <div class="desk">
        <div class="desk-work" data-work>
          <article class="work">
            <header class="work-header">
              <h2 id="work-title" data-work-title>Loading…</h2>
              <p data-work-subtitle></p>
              <div class="work-actions">
                <button type="button" class="button btn btn-outline-secondary button-ghost button-sm" data-transfer-copy title="Copy this wrestler as JSON"><span data-icon="copy"></span><span>Copy</span></button>
                <button type="button" class="button btn btn-outline-secondary button-ghost button-sm" data-transfer-paste title="Paste a wrestler's look and profile from the clipboard"><span data-icon="clipboard-paste"></span><span>Paste</span></button>
                <button type="button" class="button btn btn-outline-secondary button-ghost button-sm" data-transfer-download title="Download this wrestler's JSON file"><span data-icon="file-json"></span><span>Download</span></button>
                <button type="button" class="button btn btn-outline-danger button-ghost button-sm button-danger" data-remove hidden title="Remove this created wrestler"><span data-icon="trash-2"></span><span>Remove</span></button>
              </div>
            </header>
            <div class="work-body">
              <!-- Pane 1: the stage and the costume slots -->
              <div class="work-stage">
                <div class="stage-frame">
                  <canvas data-stage role="img" aria-label="3D model of the wrestler"></canvas>
                  <div class="stage-toolbar">
                    <button type="button" class="button btn btn-outline-secondary button-ghost button-small stage-toggle" data-stage-figure aria-pressed="false"><span data-icon="bone"></span><span>Stick figure</span></button>
                    <button type="button" class="button btn btn-outline-secondary button-ghost button-small stage-toggle" data-stage-model aria-pressed="true"><span data-icon="box"></span><span>3D model</span></button>
                    <span class="toolbar-divider"></span>
                    <div class="segmented" role="tablist" aria-label="Textures">
                      <button type="button" role="tab" data-stage-skin="textured" aria-selected="true">Textured</button>
                      <button type="button" role="tab" data-stage-skin="clay" aria-selected="false">Clay</button>
                    </div>
                    <span class="toolbar-divider"></span>
                    <button type="button" class="button btn btn-outline-secondary button-ghost button-small" data-stage-view="front"><span>Front</span></button>
                    <button type="button" class="button btn btn-outline-secondary button-ghost button-small" data-stage-view="side"><span>Side</span></button>
                    <span class="toolbar-divider"></span>
                    <label class="bone-size" data-stage-bones title="Bone thickness"><input type="range" min="0.5" max="3" step="0.1" value="1.2" aria-label="Bone thickness"></label>
                    <button type="button" class="button btn btn-outline-secondary button-ghost button-small button-icon stage-toggle" data-stage-rotate aria-pressed="true" aria-label="Turn automatically"><span data-icon="rotate-cw"></span></button>
                    <button type="button" class="button btn btn-outline-secondary button-ghost button-small button-icon stage-toggle" data-stage-play aria-pressed="true" aria-label="Pause the idle motion"><span data-icon="pause"></span></button>
                  </div>
                  <div class="stage-corner">
                    <div class="segmented" role="tablist" aria-label="Look">
                      <button type="button" role="tab" data-look-mode="ring" aria-selected="true">Ring</button>
                      <button type="button" role="tab" data-look-mode="entrance" aria-selected="false">Entrance</button>
                    </div>
                  </div>
                  <span class="stage-badge" data-stage-status><span class="badge badge-accent">Loading model</span></span>
                </div>
                <div class="work-stage-bar" data-stage-bar>
                  <section class="inspector-section costume-section">
                    <h3>Costume <small data-costume-count>4 for this wrestler</small></h3>
                    <div class="segmented" role="tablist" aria-label="Costume" data-costumes></div>
                  </section>
                  <section class="inspector-section stage-facts">
                    <h3>Model <small data-model-facts></small></h3>
                  </section>
                </div>
              </div>
              <!-- Pane 2: the editor tabs -->
              <div class="work-panel">
                <div class="work-tabs" data-work-tabs>
                  <div class="segmented tab-list" role="tablist" aria-label="Editor" data-tabs="work">
                    <button type="button" role="tab" data-tab="profile" aria-selected="false"><span data-icon="user"></span>Profile</button>
                    <button type="button" role="tab" data-tab="moves" aria-selected="false" aria-disabled="true" disabled title="Moves are not editable in this app yet"><span data-icon="zap"></span>Moves</button>
                    <button type="button" role="tab" data-tab="look" aria-selected="true"><span data-icon="shirt"></span>Look</button>
                    <button type="button" role="tab" data-tab="entrance" aria-selected="false" aria-disabled="true" disabled title="Entrances are not editable in this app yet"><span data-icon="clapperboard"></span>Entrance</button>
                  </div>
                </div>
                <div class="work-panels">
                  <div class="tab-panel" role="tabpanel" data-panel="profile" hidden></div>
                  <div class="tab-panel" role="tabpanel" data-panel="look"></div>
                </div>
              </div>
            </div>
          </article>
        </div>
        <!-- Pane 3: the roster -->
        <aside class="desk-roster" aria-label="Roster">
          <div class="roster-sort" data-roster-sort>
            <select class="input select form-select" aria-label="Sort the roster" data-sort>
              <option value="slot">Slot, roster order</option>
              <option value="name">Name, A to Z</option>
              <option value="height">Height, tallest first</option>
              <option value="weight">Weight, heaviest first</option>
            </select>
          </div>
          <div class="data-grid" role="grid" aria-label="Wrestlers">
            <div class="data-grid-head" role="row">
              <div class="data-grid-header" role="columnheader"><button type="button" class="data-grid-sort" data-sort-key="name"><span>Name</span></button></div>
              <div class="data-grid-header numeric" role="columnheader"><button type="button" class="data-grid-sort" data-sort-key="slot"><span>Slot</span></button></div>
            </div>
            <div class="data-grid-body" data-roster-rows></div>
            <div class="data-grid-empty" data-roster-empty hidden></div>
          </div>
          <div class="roster-footer">
            <button type="button" class="button btn btn-secondary button-secondary button-sm roster-add" data-add-wrestler><span data-icon="plus"></span><span>Add wrestler</span></button>
            <small data-roster-note></small>
          </div>
        </aside>
      </div>
    </div>
  </main>

  <dialog class="dialog" data-changes-dialog aria-labelledby="changes-heading">
    <form method="dialog">
      <header class="dialog-header">
        <h2 id="changes-heading">Changes</h2>
        <button type="submit" class="button btn btn-outline-secondary button-ghost button-small button-icon" aria-label="Close"><span data-icon="x"></span></button>
      </header>
      <p class="section-note">Edits are kept in this browser until you discard them. Export the roster to save them as JSON in the project.</p>
      <ol class="changes-list" data-changes-list></ol>
      <footer class="dialog-footer">
        <button type="button" class="button btn btn-outline-danger button-ghost button-sm button-danger" data-discard><span data-icon="undo-2"></span><span>Discard all changes</span></button>
        <button type="button" class="button btn btn-primary button-accent button-sm" data-action="export"><span data-icon="download"></span><span>Export roster</span></button>
      </footer>
    </form>
  </dialog>

  <div class="toast-region" role="status" aria-live="polite" data-toasts></div>
  <div class="boot-error" data-boot-error hidden></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
