<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .space-background {
            display: flex;
            justify-content: center;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #0b0d17 0%, #000 100%);
            overflow: hidden;
        }

        .nebula-cloud {

            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
        }

        .cloud-1 {
            width: 400px;
            height: 400px;
            background: #4b0082;
            top: -100px;
            left: -100px;
        }

        .cloud-2 {
            width: 300px;
            height: 300px;
            background: #ff00ff;
            bottom: -100px;
            right: -100px;
        }

        .cloud-3 {
            width: 200px;
            height: 200px;
            background: #00ffff;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            background: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAUA...') repeat;
            opacity: 0.8;
        }
</style>

</head>
<body>

    <div class="space-background">
    <div class="nebula-cloud cloud-1"></div>
    <div class="nebula-cloud cloud-2"></div>
    <div class="nebula-cloud cloud-3"></div>
    <div class="stars"></div>
    </div>

    
</body>
</html>
